<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Four Seats: a classroom simulation on responsibility, ethical theory and AI.">
<title>Four Seats</title>
<style>
:root {
  /* Layout: a printed case study. One narrow serif column, ruled sections, exhibits set as documents. One step per screen. */
  --paper: #ffffff;
  --ink: #151515;
  --muted: #5d5d5d;
  --rule: #c9c9c9;
  --wash: #f3f3f1;
  --accent: #7a1f2b;
  --good: #1f5f3a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #141414; --ink: #ececec; --muted: #a3a3a3; --rule: #3d3d3d; --wash: #1f1f1f; --accent: #e59aa3; --good: #7fd0a0; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #141414; --ink: #ececec; --muted: #a3a3a3; --rule: #3d3d3d; --wash: #1f1f1f; --accent: #e59aa3; --good: #7fd0a0; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.55; }
.wrap { max-width: 680px; margin: 0 auto; padding: 20px 20px 72px; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.top .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: var(--sans); font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.top .name { color: var(--ink); font-weight: 700; }
.bar { height: 2px; background: var(--rule); } .bar i { display: block; height: 100%; background: var(--ink); }
.part { font-family: var(--sans); font-size: 12.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin: 4px 0 0; }
h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(27px, 5.2vw, 36px); line-height: 1.12; margin: 4px 0 0; text-wrap: balance; }
main { display: flex; flex-direction: column; gap: 20px; }
p { margin: 0; max-width: 64ch; }
.lead { font-size: 20.5px; line-height: 1.45; }
.tag { display: block; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.case { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 12px 0 14px; }
.case ul { margin: 8px 0 0; padding-left: 20px; } .case li { margin: 5px 0; }
.doc { border: 1px solid var(--ink); background: var(--wash); }
.doc .hd { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 7px 14px; border-bottom: 1px solid var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.doc .hd span + span { color: var(--muted); font-weight: 400; }
.doc .bd { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 9px; }
.doc .meta { font-family: var(--mono); font-size: 14px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; }
.doc .meta b { font-weight: 400; color: var(--ink); }
.doc .foot { font-family: var(--sans); font-size: 13px; color: var(--muted); }
.term { border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); padding: 12px 0 14px; }
.term .tag { color: var(--accent); }
.term h2 { font-family: var(--serif); font-size: 23px; font-style: italic; margin: 0 0 6px; }
.term p + p { margin-top: 8px; }
.term .src { font-family: var(--sans); color: var(--muted); font-size: 13.5px; margin-top: 10px; }
.objection { border-left: 0; background: var(--wash); padding: 14px 16px; }
.objection .tag { color: var(--accent); }
.q { display: flex; flex-direction: column; gap: 8px; }
.q > label, .q > .label { font-weight: 700; }
.hint { font-family: var(--sans); color: var(--muted); font-size: 14px; font-weight: 400; }
textarea, input[type="text"], input[type="number"] { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 0; padding: 10px 12px; width: 100%; }
textarea { resize: vertical; min-height: 88px; }
.opts { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--ink); }
.opts.row { flex-direction: row; flex-wrap: wrap; }
.opt { position: relative; display: block; border-bottom: 1px solid var(--rule); }
.opts.row .opt { flex: 1 1 auto; border-bottom: 0; border-right: 1px solid var(--rule); }
.opt:last-child { border-bottom: 0; border-right: 0; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt input:disabled { cursor: default; }
.opt span { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 14px; align-items: baseline; }
.opt span i { font-family: var(--sans); font-style: normal; font-weight: 700; font-size: 14px; color: var(--muted); }
.opts.row .opt span { display: block; text-align: center; }
.opt input:checked + span { background: var(--ink); color: var(--paper); } .opt input:checked + span i { color: var(--paper); }
.opt input:disabled:not(:checked) + span { color: var(--muted); }
.opt input:focus-visible + span, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { font-family: var(--sans); font-size: 15px; font-weight: 700; letter-spacing: .03em; border-radius: 0; padding: 12px 20px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); }
button.small { padding: 6px 12px; }
button:disabled { opacity: .35; cursor: not-allowed; }
.split { display: flex; flex-direction: column; border: 1px solid var(--ink); }
.split .rowx { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
.split .rowx:last-child { border-bottom: 0; }
.split .ctl { display: flex; align-items: center; gap: 6px; }
.split input { width: 74px; text-align: center; font-variant-numeric: tabular-nums; padding: 6px; }
.total { font-family: var(--sans); font-weight: 700; font-variant-numeric: tabular-nums; } .total.bad { color: var(--accent); }
.numrow { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; } .numrow input { width: 150px; font-variant-numeric: tabular-nums; }
.fb { font-family: var(--sans); font-size: 15px; } .fb.good { color: var(--good); font-weight: 700; } .fb.bad { color: var(--accent); font-weight: 700; }
.work { background: var(--wash); padding: 10px 14px; font-size: 16.5px; }
.cases { display: flex; flex-direction: column; gap: 16px; }
.cases .item { border-top: 1px solid var(--ink); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.cases .sub { font-family: var(--sans); color: var(--muted); font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 16.5px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--sans); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--ink); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; padding-right: 0; padding-left: 10px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; border-top: 1px solid var(--ink); padding-top: 16px; }
.nav .why { font-family: var(--sans); color: var(--muted); font-size: 14px; flex: 1; text-align: right; min-width: 180px; }
.sum h2 { font-family: var(--sans); font-size: 13px; letter-spacing: .09em; text-transform: uppercase; margin: 22px 0 8px; padding-top: 10px; border-top: 1px solid var(--ink); }
.sum dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.sum dt { font-family: var(--sans); color: var(--muted); font-size: 13.5px; }
.sum dd { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.share { background: var(--wash); padding: 14px 16px; } .share ul { margin: 6px 0 0; padding-left: 20px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
[hidden] { display: none !important; }
@media print { .nav, .tools, .top { display: none; } }
</style>
</head>

  });

  steps.push(
    { part: "Part 1: One year later", title: "The audit", blocks: [
      { t: "p", text: "An outside auditor re-reads a year of applications to Harlow Freight and judges, without the tool, which applicants were qualified." },
      { t: "doc", label: "Exhibit 5", kind: "Audit findings", table: { head: ["Qualified applicants", "Number", "Passed by the tool"], num: [1, 2], rows: [["No gap in work history", "600", "480"], ["Gap of six months or more", "300", "108"], ["All qualified applicants", "900", "588"]] },
        foot: "The tool had learned to copy the company’s past hiring. It marked applicants down for a gap in their work history and for degrees from schools the company had rarely hired from." },
      { t: "num", key: "n1", label: "How many qualified applicants did the tool turn away?", answer: 312, tol: 0, wrong: "Qualified applicants minus those the tool passed.", solution: "900 qualified minus 588 passed leaves 312 qualified people turned away. A qualified applicant with a gap got through 36% of the time; one without, 80%." },
      { t: "p", lead: true, when: function (a) { return a.n1Ok || (a.n1Tries || 0) >= 3; }, text: function (a) { var n = harm(a); return "At the company, all four people took the quickest option. With your four decisions the number would have been " + (n < 5 ? "close to zero" : n) + "."; } },
      { t: "table", when: function (a) { return a.n1Ok || (a.n1Tries || 0) >= 3; }, head: ["Seat", "Your decision", "Effect"], rows: function (a) {
        return SEATS.map(function (s) { var v = a[s.k]; return [s.role, s.short[v] || "", v === "slow" ? "Cut the harm by " + Math.round((1 - s.factor) * 100) + "%. Cost: " + lc(s.cost) : v === "fig" ? "Almost none. It felt responsible and changed very little." : "None. Thanked for it."]; }); } },
      { t: "p", when: function (a) { return a.n1Ok || (a.n1Tries || 0) >= 3; }, text: "You knew you were playing all four seats. At the company, four different people sat in them, each saw only their own exhibits, and each was told someone else had it covered. From here on, the case is the company’s version: four quick decisions, 312 people." },
      { t: "choice", key: "blame", lock: true, when: function (a) { return a.n1Ok || (a.n1Tries || 0) >= 3; }, label: "Who do you hold most responsible?", hint: "Your answer locks. The next three steps will test it.", options: ROLES },

    { part: "Part 2: Three old schools", title: "Aristotle: what kind of person?", blocks: [
      { t: "p", lead: true, text: function (a) { return "You blamed " + blamed(a) + " for a decision. Aristotle would start somewhere else. He would not ask which decision was wrong. He would ask what kind of person makes it."; } },
      { t: "term", tag: "Section 2.2", name: "Virtue", def: [
        "A virtue is a habit: a settled readiness to do the right thing, for the right reason, in the right kind of situation. Nobody is born with one. You build it by practice and by copying people who already have it.",
        "Each virtue is a middle path between two ways of going wrong. Courage sits between cowardice and recklessness. And the virtues lean on each other: Aristotle thinks you cannot fully have one without the rest." ], src: "Chapter 2, paragraphs 2.21 to 2.24" },
      { t: "p", text: "Build the middle path for someone who works with an automated tool. One extreme is the person who believes whatever the tool says. The other is the person who refuses to use any tool at all." },

        { v: "char", label: "The person she let herself become over the year." },
        { v: "none", label: "Neither. Her boss built the habit, not her." }] },
      { t: "objection", when: function (a) { return !!a.vResp; }, tag: "The other side", text: function (a) {
        return a.vResp === "act" ? "Taken one at a time, every Monday was defensible: six hours, a boss who said to trust the tool. If each act is excusable, where does the blame come from? Aristotle would say you are looking at the wrong unit."

          : "Then nobody who works under pressure is ever responsible for what they turn into. Aristotle says habits come from our own repeated choices. Did she have no choices on any of fifty-two Mondays?"; } },

    ] },

    { part: "Part 2: Three old schools", title: "Confucius and ubuntu: who are you to each other?", blocks: [
      { t: "p", lead: true, text: "Two traditions from outside Western philosophy start from a different place again: not the person, and not the rule, but the relationship." },

        "The legal scholar Jacob Turner makes the point with driving. Traffic law assumes a human driver who can be held responsible and who owes a duty of care. A car that drives itself has no such duties. So the law needs new parts. The chapter says ethics may be in the same position: it may need new principles and new ideas." ], src: "Chapter 2, paragraphs 2.79 to 2.82" },

      return q;
    },
    choice: function (b) {
      var name = "c" + (++uid), q = el("div", "q"); q.setAttribute("role", "radiogroup"); q.appendChild(el("span", "label", val(b.label)));
      if (b.hint) q.appendChild(el("span", "hint", val(b.hint)));
      var box = el("div", "opts" + (b.row ? " row" : "")), locked = (b.lock && !!state.a[b.key]) || (b.lockAfter && !!state.rev[b.lockAfter]);
      val(b.options).forEach(function (o, n) {
        var l = el("label", "opt"), i = el("input"); i.type = "radio"; i.name = name; i.value = o.v; i.checked = state.a[b.key] === o.v; i.disabled = !!locked;
        i.addEventListener("change", function () { state.a[b.key] = o.v; changed(); if (b.rerender || b.lock) show(true); });
        var sp = el("span"); if (!b.row) sp.appendChild(el("i", null, String.fromCharCode(65 + n))); sp.appendChild(document.createTextNode(o.label));
        l.appendChild(i); l.appendChild(sp); box.appendChild(l);
      });
      q.appendChild(box); checks.push(function () { return !!state.a[b.key]; }); return q;
    },
    doc: function (b) {
      var d = el("div", "doc"), hd = el("div", "hd"); hd.appendChild(el("span", null, val(b.label))); if (b.kind) hd.appendChild(el("span", null, val(b.kind))); d.appendChild(hd);
      var bd = el("div", "bd");
      if (b.meta) { var m = el("div", "meta"); val(b.meta).forEach(function (r) { m.appendChild(el("span", null, r[0])); m.appendChild(el("b", null, r[1])); }); bd.appendChild(m); }
      [].concat(val(b.body) || []).forEach(function (x) { x = val(x); if (x) bd.appendChild(el("p", null, x)); });
      if (b.table) bd.appendChild(R.table(b.table));
      if (b.foot) bd.appendChild(el("p", "foot", val(b.foot)));
      d.appendChild(bd); return d;
    },
    objection: function (b) {
      var x = val(b.text); if (!x) return null;
      var d = el("div", "objection"); d.appendChild(el("span", "tag", b.tag || "Objection")); d.appendChild(el("p", null, x)); return d;
    },
    num: function (b) {
      var id = "f" + (++uid), q = el("div", "q"), lab = el("label", null, val(b.label)); lab.htmlFor = id; q.appendChild(lab);
      if (b.hint) q.appendChild(el("span", "hint", val(b.hint)));
      var okK = b.key + "Ok", trK = b.key + "Tries", done = !!state.a[okK] || (state.a[trK] || 0) >= 3;
      var row = el("div", "numrow"), i = el("input"), btn = el("button", null, "Check"); i.type = "text"; i.inputMode = "decimal"; i.id = id; i.value = state.a[b.key] || ""; i.disabled = done; btn.type = "button"; btn.disabled = done;
      i.addEventListener("input", function () { state.a[b.key] = i.value; save(); });
      function go() { var v = parseFloat(String(i.value).replace(/[%,\s]/g, "")); if (isNaN(v)) return; state.a[trK] = (state.a[trK] || 0) + 1; if (Math.abs(v - b.answer) <= (b.tol || 0) || (b.alt != null && Math.abs(v - b.alt) <= (b.altTol || 0))) state.a[okK] = true; save(); show(true); }
      btn.addEventListener("click", go); i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
      row.appendChild(i); row.appendChild(btn); q.appendChild(row);
      if (state.a[okK]) { q.appendChild(el("span", "fb good", "Correct.")); q.appendChild(el("div", "work", val(b.solution))); }
      else if ((state.a[trK] || 0) >= 3) { q.appendChild(el("span", "fb bad", "Not this time. Here is the working.")); q.appendChild(el("div", "work", val(b.solution))); }
      else if (state.a[trK]) q.appendChild(el("span", "fb bad", "Not yet. " + (val(b.wrong) || "Check your working and try again.") + " (" + (3 - state.a[trK]) + " tries left)"));
      checks.push(function () { return !!state.a[okK] || (state.a[trK] || 0) >= 3; });
      return q;
    },
    quiz: function (b) {
      var name = "z" + (++uid), q = el("div", "q"); q.setAttribute("role", "radiogroup"); q.appendChild(el("span", "label", val(b.label)));
      var box = el("div", "opts" + (b.row ? " row" : "")), picked = state.a[b.key];
      b.options.forEach(function (o, n) {
        var l = el("label", "opt"), i = el("input"); i.type = "radio"; i.name = name; i.checked = picked === o.v; i.disabled = !!picked;
        i.addEventListener("change", function () { state.a[b.key] = o.v; changed(); show(true); });
        var sp = el("span"); if (!b.row) sp.appendChild(el("i", null, String.fromCharCode(65 + n))); sp.appendChild(document.createTextNode(o.label));
        l.appendChild(i); l.appendChild(sp); box.appendChild(l);
      });
      q.appendChild(box);
      if (picked) { var right = picked === b.correct, lab = b.options.filter(function (o) { return o.v === b.correct; })[0].label;
        q.appendChild(el("span", "fb " + (right ? "good" : "bad"), right ? "Correct." : "Not this one. The answer is " + lab + "."));
        if (b.explain) q.appendChild(el("div", "work", val(b.explain))); }
      checks.push(function () { return !!state.a[b.key]; }); return q;
    },
    split: function (b) {
      var q = el("div", "q"); q.appendChild(el("span", "label", val(b.label)));
      var cur = state.a[b.key]; if (!cur) { cur = {}; var init = b.init ? b.init(state.a) : null; b.parties.forEach(function (p) { cur[p.k] = init ? (Number(init[p.k]) || 0) : 0; }); state.a[b.key] = cur; }
      var box = el("div", "split"), tot = el("div", "total"), inputs = {};
      function sum() { return b.parties.reduce(function (s, p) { return s + (Number(cur[p.k]) || 0); }, 0); }
      function upd() { var s = sum(); tot.textContent = "Total: " + s + " of 100" + (s === 100 ? "" : s < 100 ? "  (" + (100 - s) + " left to give)" : "  (" + (s - 100) + " too many)"); tot.className = "total" + (s === 100 ? "" : " bad"); }
      b.parties.forEach(function (p) {
        var r = el("div", "rowx"), id = "f" + (++uid), lab = el("label", null, p.label); lab.htmlFor = id; r.appendChild(lab);
        var c = el("div", "ctl"), m = el("button", "small", "−"), i = el("input"), pl = el("button", "small", "+");
        m.type = "button"; pl.type = "button"; m.setAttribute("aria-label", "5 fewer for " + p.label); pl.setAttribute("aria-label", "5 more for " + p.label);
        i.type = "number"; i.min = 0; i.max = 100; i.step = 5; i.id = id; i.value = cur[p.k]; inputs[p.k] = i;
        function set(v) { v = Math.max(0, Math.min(100, Math.round(Number(v) || 0))); cur[p.k] = v; i.value = v; upd(); changed(); }
        m.addEventListener("click", function () { set(cur[p.k] - 5); }); pl.addEventListener("click", function () { set(cur[p.k] + 5); });
        i.addEventListener("change", function () { set(i.value); });
        c.appendChild(m); c.appendChild(i); c.appendChild(pl); r.appendChild(c); box.appendChild(r);
      });
      q.appendChild(box); q.appendChild(tot); upd(); checks.push(function () { return sum() === 100; }); return q;
    },
    cases: function (b) {
      var cur = state.a[b.key] || (state.a[b.key] = {}), box = el("div", "cases");
      b.items.forEach(function (it, n) {
        var c = cur[it.k] || (cur[it.k] = {}), d = el("div", "item"); d.appendChild(el("p", null, it.text));
        var name = "k" + (++uid), o1 = el("div", "opts row"), sub = el("div", "q");
        [["fine", "Fine"], ["wrong", "Wrong"], ["depends", "Depends"]].forEach(function (o) {
          var l = el("label", "opt"), i = el("input"); i.type = "radio"; i.name = name; i.checked = c.v === o[0];
          i.addEventListener("change", function () { c.v = o[0]; if (o[0] === "fine") c.who = ""; sub.hidden = o[0] === "fine"; changed(); });
          l.appendChild(i); l.appendChild(el("span", null, o[1])); o1.appendChild(l);
        });
        d.appendChild(o1);
        sub.appendChild(el("span", "sub", "If something is wrong here, who or what is wronged?"));
        var name2 = "k" + (++uid), o2 = el("div", "opts row");
        b.who.forEach(function (o) {
          var l = el("label", "opt"), i = el("input"); i.type = "radio"; i.name = name2; i.checked = c.who === o.v;
          i.addEventListener("change", function () { c.who = o.v; changed(); });
          l.appendChild(i); l.appendChild(el("span", null, o.label)); o2.appendChild(l);
        });
        sub.appendChild(o2); sub.hidden = !c.v || c.v === "fine"; d.appendChild(sub); box.appendChild(d);
        checks.push(function () { return c.v === "fine" || (!!c.v && !!c.who); });
      });
      return box;
    },
    table: function (b) {
      var w = el("div", "tablewrap"), t = el("table"), hr = el("tr"), num = b.num || [];
      b.head.forEach(function (h, i) { var th = el("th", num.indexOf(i) >= 0 ? "n" : null, h); th.scope = "col"; hr.appendChild(th); }); t.appendChild(hr);
      val(b.rows).forEach(function (r) { var tr = el("tr"); r.forEach(function (c, i) { tr.appendChild(el("td", num.indexOf(i) >= 0 ? "n" : null, String(c))); }); t.appendChild(tr); });
      w.appendChild(t); return w;
    },
    reveal: function (b) {
      if (state.rev[b.key]) return null;
      var btn = el("button", "primary", b.button || "See what the chapter calls this"); btn.type = "button";
      var mine = checks.slice();
      function ready() { return mine.every(function (f) { return f(); }); }
      updaters.push(function () { btn.disabled = !ready(); });
      btn.addEventListener("click", function () { if (!ready()) return; state.rev[b.key] = true; save(); show(true, b.key); });
      checks.push(function () { return !!state.rev[b.key]; });
      var d = el("div"); d.appendChild(btn); return d;
    }
  };

  function summary() {
    var root = el("div", "sum"), secs = L.summary(state.a), lines = [L.name, ""];
    var sh = el("div", "share"); sh.appendChild(el("strong", null, "For the share-out, be ready to read:")); var ul = el("ul");
    L.share.forEach(function (x) { ul.appendChild(el("li", null, x)); }); sh.appendChild(ul); root.appendChild(sh);
    secs.forEach(function (s) {
      root.appendChild(el("h2", null, s.h)); lines.push(s.h.toUpperCase());
      var dl = el("dl"); s.items.forEach(function (it) { var w = el("div"); w.appendChild(el("dt", null, it.q)); w.appendChild(el("dd", null, it.a || "—")); dl.appendChild(w); lines.push(it.q + "\n  " + (it.a || "-")); });
      root.appendChild(dl); lines.push("");
    });
    var tools = el("div", "tools"), copy = el("button", "primary", "Copy my answers"), msg = el("span", "hint"), reset = el("button", null, "Start over"), armed = false;
    copy.type = "button"; reset.type = "button";
    var ta = el("textarea"); ta.readOnly = true; ta.rows = 8; ta.value = lines.join("\n"); ta.hidden = true; ta.setAttribute("aria-label", "Your answers as plain text");
    copy.addEventListener("click", function () {
      var fail = function () { ta.hidden = false; ta.focus(); ta.select(); msg.textContent = "Copy didn’t work here. Select the text below and copy it."; };
      try { navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = "Copied. Paste it wherever your instructor asks."; }, fail); } catch (e) { fail(); }
    });
    reset.addEventListener("click", function () {
      if (!armed) { armed = true; reset.textContent = "Confirm: erase all answers"; setTimeout(function () { armed = false; reset.textContent = "Start over"; }, 5000); return; }
      state = { a: {}, rev: {}, step: 0 }; save(); show();
    });
    tools.appendChild(copy); tools.appendChild(reset); tools.appendChild(msg); root.appendChild(tools); root.appendChild(ta);
    return root;
  }

  function show(keep, focusKey) {
    var n = L.steps.length; state.step = Math.max(0, Math.min(n - 1, state.step | 0));
    var st = L.steps[state.step], main = $("main"), y = window.scrollY;
    main.textContent = ""; checks = []; updaters = []; whens = []; uid = 0;
    $("lesson-name").textContent = L.name; $("step-count").textContent = "Step " + (state.step + 1) + " of " + n;
    $("bar").style.width = Math.round(100 * (state.step + 1) / n) + "%";
    $("part").textContent = st.part || ""; $("title").textContent = val(st.title);
    var mark = null;
    if (st.summary) main.appendChild(summary());
    else st.blocks.forEach(function (b) {
      if (b.after && !state.rev[b.after]) return;
      if (b.when) { var wv = !!b.when(state.a); whens.push({ f: b.when, v: wv }); if (!wv) { if (INPUTS[b.t]) checks.push(function () { return false; }); return; } }
      var node = R[b.t](b); if (!node) return;
      if (focusKey && b.after === focusKey && !mark) mark = node;
      main.appendChild(node);
    });
    updaters.forEach(function (f) { f(); }); nav(); save();
    if (keep) { window.scrollTo(0, y); if (mark && mark.scrollIntoView) mark.scrollIntoView({ block: "start", behavior: "smooth" }); }
    else { window.scrollTo(0, 0); }
  }
  function ok() { return checks.every(function (f) { return f(); }); }
  function nav() {
    var last = state.step === L.steps.length - 1, good = ok();
    $("back").disabled = state.step === 0; $("next").hidden = last; $("next").disabled = !good;
    $("why").textContent = last || good ? "" : "Answer everything on this page to continue.";
  }
  $("back").addEventListener("click", function () { if (state.step > 0) { state.step--; show(); } });
  $("next").addEventListener("click", function () { if (ok() && state.step < L.steps.length - 1) { state.step++; show(); $("title").focus({ preventScroll: true }); } });
  show();
})();
</script>
